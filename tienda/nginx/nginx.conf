# Reverse proxy: / -> static web, /api -> shop-api. Same origin for both, so the
# RUM SDK can inject trace headers into the fetch() calls (allowedTracingUrls)
# and Datadog links the browser session with the backend trace.
# JSON access log: no parsing needed in the pipeline. Compare with shop-api's plain text.
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"referer":"$http_referer","user_agent":"$http_user_agent",'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    location /api/ {
        proxy_pass http://shop-api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        proxy_pass http://shop-api:8081/actuator/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # the RUM config is injected at container start from env vars (see web/entrypoint.sh)
    }
}
